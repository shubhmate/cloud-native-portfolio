	<style>
		:root {
			--accent: #3b82f6; /* Change to your brand color */
		}
		body {
			margin: 0;
			display: flex;
			align-items: center;
			justify-content: center;
			min-height: 100vh;
			background-color: #f3f4f6;
		}
		.logo-wrapper {
			position: relative;
			width: 512px;
			height: 512px;
			/* Add these two lines for the "Round" look */
			/* Filled circle background */
			/* background: var(--accent); */
			/* background: #0f1117; */
			border-radius: 50%;        /* Makes the container a perfect circle */
			
			display: flex;
			align-items: center;
			justify-content: center;
			overflow: hidden;
		}
		
		/* Adjust icon colors to contrast with the new background */
		.logo-wrapper svg.cloud-icon {
			width: 75%;
			height: 75%;
			color: var(--accent); /* Blue cloud on white background */
			/* opacity: 0.4; */
		}
		.logo-wrapper svg.terminal-icon {
			position: absolute;
			width: 22%;
			height: 22%;
			color: var(--accent); /* Blue terminal icon */
			top: 55%;
			left: 50%;
			transform: translate(-50%, -50%);
		}
	</style>

</head>
<body>

    <div class="logo-wrapper" id="capture">
        <!-- We add classes so the CSS knows which SVG is which after replacement -->
        <i data-lucide="cloud" class="cloud-icon"></i>
        <i data-lucide="terminal" class="terminal-icon"></i>
    </div>

    <script>
        // Manually trigger the icon replacement
        lucide.createIcons();
    </script>
</body>
