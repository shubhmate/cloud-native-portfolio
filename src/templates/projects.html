<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <!-- ==================== Analytics & Tracking ==================== -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-J7EET7JXCE"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'G-J7EET7JXCE');
  </script>

  <!-- ==================== Basic Meta Tags & SEO ==================== -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Project Library | Detailed technical case studies and cloud-native solutions by {{PERSON_NAME}}.">
  <meta name="author" content="{{PERSON_NAME}}">
  <meta name="theme-color" content="#0f1117">
  <meta name="google-site-verification" content="coUns_TAORdxxDo1tvnhKrEO367dmIXNwi7hq5YSWl8" />

  <!-- ==================== Page Title & Favicons ==================== -->
  <title>Project Library | {{PERSON_NAME}} - {{JOB_TITLE}}</title>
  <link rel="icon" href="assets/img/favicon_io_black_bg_circle/favicon.ico" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="assets/img/favicon_io_white_bg_circle/favicon.ico" media="(prefers-color-scheme: light)">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/img/favicon_io_black_bg_circle/apple-touch-icon.png">

  <!-- ==================== Fonts & Icons ==================== -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@0.311.0/dist/umd/lucide.js" defer></script>

  <!-- ==================== Core Styles & Inline CSS ==================== -->
  <link rel="stylesheet" href="assets/css/{{CSS_FILENAME}}">
  <style>
    /* Critical Preloader Styles */
    #preloader {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background-color: #0a0a0a; z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    .preloader-content { display: flex; flex-direction: column; align-items: center; color: #3b82f6; }
    @keyframes pulse-custom { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
    .animate-pulse-custom { animation: pulse-custom 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
  </style>
</head>

<body>
  <!-- ==================== Global UI Components ==================== -->

  <!-- Preloader (Identical to index.html) -->
  <div id="preloader">
    <div class="preloader-content animate-fade-up">
      <div class="relative w-24 h-24 flex items-center justify-center">
        <i data-lucide="cloud" class="w-full h-full text-[var(--accent)]"></i>
        <i data-lucide="terminal" class="absolute w-8 h-8 text-[var(--accent)] animate-pulse-custom top-[55%] left-1/2 -translate-x-1/2 -translate-y-1/2"></i>
      </div>
      <p class="font-mono text-xl text-[var(--accent)] mt-6 flex items-center gap-2">
        <span class="animate-pulse-custom">_</span> Loading Project Library...
      </p>
    </div>
  </div>

  <!-- Toast Container -->
  <div id="toast-container"></div>

  <!-- Scroll to Top Button -->
  <button id="scroll-to-top" aria-label="Scroll to top" title="Back to top" class="group flex items-center justify-center w-12 h-12 rounded-2xl bg-white/70 dark:bg-slate-950/60 backdrop-blur-md border border-slate-200 dark:border-white/10 text-[var(--accent)] transition-all shadow-md dark:shadow-[inset_0_1px_1px_rgba(255,255,255,0.1),0_10px_20px_rgba(0,0,0,0.4)] hover:border-[var(--accent)]/50 hover:bg-[var(--accent)]/5 hover:scale-105 active:scale-95">
    <i data-lucide="arrow-up" class="w-5 h-5 transition-transform group-hover:-translate-y-1"></i>
  </button>

  <!-- Navigation Bar -->
  {{GLOBAL_NAVBAR}}

  <!-- ==================== Main Content Area ==================== -->
  <main id="main-content" class="pt-24 md:pt-32">
    <section class="max-w-6xl mx-auto px-6">
      <div class="animate-fade-up">
        <div class="flex items-center gap-2 mb-2 text-[var(--accent)]">
          <i data-lucide="folder-git-2" class="w-5 h-5"></i>
          <p class="font-mono text-sm tracking-tight">{{PROJECTS_TAGLINE}}</p>
        </div>
        <h1 class="font-mono text-4xl md:text-5xl font-bold mb-6">{{PROJECTS_TITLE}}</h1>
        <p class="text-[var(--muted)] text-lg max-w-2xl leading-relaxed mb-12">
          {{PROJECTS_SUBTITLE}}
        </p>
      </div>

      <!-- Projects Library Grid -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
        {{PROJECTS_LIBRARY_GRID}}
      </div>
    </section>
    
    <!-- ==================== CTA Section (Closing Action) ==================== -->
    <section class="mt-24 animate-fade-up max-w-6xl mx-auto px-6">
      <div class="p-8 sm:p-12 md:p-16 rounded-3xl bg-[var(--accent)]/5 border border-[var(--accent)]/10 backdrop-blur-sm flex flex-col items-center text-center shadow-sm dark:shadow-[inset_0_1px_1px_rgba(255,255,255,0.05)]">
        <h2 class="font-mono text-2xl md:text-3xl font-bold mb-4 tracking-tight">{{PROJECTS_CTA_TITLE}}</h2>
        <p class="text-[var(--muted)] mb-10 max-w-lg mx-auto text-base md:text-lg leading-relaxed">
          {{PROJECTS_CTA_SUBTITLE}}
        </p>
        <a href="index.html#contact" class="group w-full sm:w-auto min-w-[280px] inline-flex items-center justify-center gap-3 px-10 py-4 bg-[var(--green)] hover:bg-green-600 text-white font-mono text-sm font-bold rounded-xl transition-all hover:scale-105 active:scale-95 shadow-xl shadow-[var(--green)]/20 whitespace-nowrap">
          <i data-lucide="send" class="w-5 h-5 transition-transform group-hover:translate-x-1 group-hover:-translate-y-1"></i>
          <span>{{PROJECTS_CTA_BUTTON}}</span>
        </a>
      </div>
    </section>
  </main>

  <!-- ==================== Global Footer & Modals ==================== -->
  {{GLOBAL_FOOTER}}
  {{GLOBAL_IMAGE_MODAL}}

  <!-- Final Core Script -->
  <script src="assets/js/{{JS_FILENAME}}" defer></script>
</body>
</html>
