# =============================================================================
# MinIO — Local S3-Compatible Object Storage
# =============================================================================
# MinIO is 100% free, open-source, and fully S3-compatible.
# Use this to test your S3 deploy workflow locally before touching real AWS.
#
# Commands:
#   npm run localstack:start   → start MinIO container
#   npm run localstack:stop    → stop and remove MinIO container
#   npm run localstack:init    → create bucket in MinIO
#   npm run deploy:localstack  → deploy dist/ to MinIO (like S3)
#
# MinIO Console (browser UI): http://localhost:9001
#   Username: test
#   Password: testpassword
#
# S3-compatible API: http://localhost:9000
# =============================================================================

services:
  minio:
    image: minio/minio:latest
    container_name: portfolio-minio
    ports:
      - "9000:9000"   # S3-compatible API (same as your deploy scripts use)
      - "9001:9001"   # MinIO Web Console (browse your bucket visually)
    environment:
      MINIO_ROOT_USER     : test
      MINIO_ROOT_PASSWORD : testpassword
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test     : ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval : 10s
      timeout  : 5s
      retries  : 5

volumes:
  minio-data:
    driver: local
