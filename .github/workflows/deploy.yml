name: 🚀 Build & Deploy Portfolio

# =============================================================================
# GitHub Actions CI/CD Pipeline — .github/workflows/deploy.yml
# =============================================================================
# This workflow automates:
#   1. Infrastructure Management (Terraform Apply)
#   2. Quality Check (Linting)
#   3. Professional Build (minification, optimization)
#   4. AWS S3 Deployment (sync assets)
#   5. CloudFront Cache Invalidation (instant updates)
#   6. Health Check (verify site is UP)
# =============================================================================

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Allow manual triggers

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}

jobs:
  # --- STAGE 1: INFRASTRUCTURE ---
  terraform-infra:
    name: 🏗️ Infrastructure (Terraform)
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🏗️ Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: latest

      - name: 🛠️ Terraform Init
        working-directory: ./terraform
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: terraform init -reconfigure

      - name: 🚀 Terraform Apply
        working-directory: ./terraform
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          TF_VAR_brevo_api_key: ${{ secrets.BREVO_API_KEY }}
        run: terraform apply -auto-approve

  # --- STAGE 2: BUILD & DEPLOY ---
  build-and-deploy:
    needs: terraform-infra
    runs-on: ubuntu-latest
    name: 📦 Build and 🚀 Deploy
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci


      - name: 🚀 Deploy to AWS
        env:
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
          DEPLOY_TARGET: aws
          AWS_REGION: ${{ env.AWS_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          CF_DIST_ID: ${{ secrets.CF_DIST_ID }}
        run: node scripts/deploy.js

      - name: 🏥 Health Check
        run: |
          echo "Verifying deployment at https://shubhammate.com..."
          sleep 10
          curl -f -L https://shubhammate.com || exit 1
          echo "✅ Site is UP and reachable!"
