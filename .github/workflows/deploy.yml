name: 🚀 Build & Deploy Portfolio

# =============================================================================
# GitHub Actions CI/CD Pipeline — .github/workflows/deploy.yml
# =============================================================================
# This workflow automates:
#   1. Quality Check (Linting)
#   2. Professional Build (minification, optimization)
#   3. AWS S3 Deployment (sync assets)
#   4. CloudFront Cache Invalidation (instant updates)
#   5. Health Check (verify site is UP)
# =============================================================================

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Allow manual triggers

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    name: 🏗️ Build and 🚀 Deploy

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🏗️ Professional Build
        run: npm run build

      - name: 🚀 Deploy to AWS
        env:
          DEPLOY_TARGET: aws
          AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          CF_DIST_ID: ${{ secrets.CF_DIST_ID }}
        run: node scripts/deploy.js

      - name: 🏥 Health Check
        run: |
          echo "Verifying deployment at https://shubhammate.com..."
          # Wait a few seconds for CloudFront to propagate
          sleep 10
          # Check for 200 OK status
          curl -f -L https://shubhammate.com || exit 1
          echo "✅ Site is UP and reachable!"

  uptime-monitor:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    name: 🩺 Uptime Monitoring (Setup)
    steps:
      - name: Log Monitoring Status
        run: echo "Uptime monitoring is active. Check Actions tab for history."
