name: 💎 Code Quality (JS/TS)

# =============================================================================
# Code Quality Analysis — .github/workflows/code-quality.yml
# =============================================================================
# This workflow ensures that:
#   1. Code follows standards (ESLint)
#   2. Types are correct (TypeScript Check)
# =============================================================================

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-typecheck:
    name: 🔍 Lint & 📦 TypeCheck
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 Lint & 📦 TypeCheck
        run: npm run lint

      - name: 📦 Run TypeScript Check
        run: npm run type-check
