<!DOCTYPE html>
<html>
<head><meta charset="UTF-8">
<style>
  body{font-family:'Segoe UI',Arial,sans-serif;background:#f1f5f9;margin:0;padding:20px}
  .wrap{max-width:560px;margin:0 auto}
  .card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 4px 24px rgba(0,0,0,.08)}
  .hdr{background:linear-gradient(135deg,#0f1117,#1e3a5f);padding:28px 36px;text-align:center}
  .hdr h1{color:#3b82f6;font-family:'Courier New',monospace;font-size:20px;margin:0 0 4px}
  .hdr p{color:#64748b;font-size:11px;margin:0;font-family:monospace}
  .badge{display:inline-block;margin-top:10px;background:#22c55e18;color:#22c55e;border:1px solid #22c55e30;border-radius:20px;padding:3px 12px;font-size:10px;font-family:monospace}
  .body{padding:28px 36px}
  .row{margin-bottom:18px}
  .lbl{font-size:10px;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:.8px;margin-bottom:5px}
  .val{font-size:14px;color:#1e293b;background:#f8fafc;border-left:3px solid #3b82f6;padding:9px 14px;border-radius:0 6px 6px 0}
  .val a{color:#3b82f6;text-decoration:none}
  .msg{background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:14px;font-size:13px;color:#334155;line-height:1.7;white-space:pre-wrap;min-height:60px}
  .btn{display:block;width:fit-content;margin:24px auto 0;background:#3b82f6;color:#fff!important;text-decoration:none;padding:11px 28px;border-radius:8px;font-weight:600;font-size:13px}
  .footer{background:#f8fafc;border-top:1px solid #e2e8f0;padding:16px 36px;text-align:center;font-size:10px;color:#94a3b8;font-family:monospace}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="hdr">
      <h1>devops.sh</h1>
      <p>// incoming_contact_request</p>
      <span class="badge">● new message received</span>
    </div>
    <div class="body">
      <div class="row">
        <div class="lbl">From</div>
        <div class="val">{{from_name}}</div>
      </div>
      <div class="row">
        <div class="lbl">Reply-To</div>
        <div class="val"><a href="mailto:{{reply_to}}">{{reply_to}}</a></div>
      </div>
      <div class="row">
        <div class="lbl">Message</div>
        <div class="msg">{{message}}</div>
      </div>
      <a href="mailto:{{reply_to}}" class="btn">↩ Reply to {{from_name}}</a>
    </div>
    <div class="footer">devops.sh · portfolio contact form · do not reply to this address</div>
  </div>
</div>
</body>
</html>
